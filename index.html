<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Web Pulse — Daily Edition</title>
<meta name="description" content="A daily print magazine assembled from the day's snapshot of the web." />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,300;1,9..144,400;1,9..144,500&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F1E9D8;
    --paper-2: #E9DFC9;
    --paper-edge: #D8CDB3;
    --ink: #0D0C09;
    --ink-2: #1F1C16;
    --grey-1: #6A6357;
    --grey-2: #948C7C;
    --rule: #2A251C;
    --red: #B23A23;
    --red-2: #8C2A18;
    --blue: #1E3A5F;
    --gold: #8A6A1E;
    --serif: 'Fraunces', 'Times New Roman', serif;
    --sans: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #1a1814; color: var(--ink); font-family: var(--serif); }
  deck-stage:not(:defined) { visibility: hidden; }
  deck-stage { --deck-bg: #1a1814; }

  /* ============ PAGE / SPREAD BASE ============ */
  .spread {
    width: 1920px; height: 1080px;
    background: var(--paper);
    position: relative;
    overflow: hidden;
    color: var(--ink);
    font-family: var(--serif);
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(0,0,0,0.04), transparent 60%),
      radial-gradient(ellipse at 0% 100%, rgba(178,58,35,0.04), transparent 50%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.08 0 0 0 0 0.07 0 0 0 0 0.05 0 0 0 0.06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    background-blend-mode: multiply;
  }
  .spread.two-page::before {
    content: ""; position: absolute; left: 50%; top: 60px; bottom: 60px;
    width: 1px; background: linear-gradient(180deg, transparent, rgba(0,0,0,0.18) 10%, rgba(0,0,0,0.18) 90%, transparent);
    transform: translateX(-0.5px); z-index: 5; pointer-events: none;
  }
  .spread.two-page::after {
    content: ""; position: absolute; left: calc(50% - 60px); right: calc(50% - 60px); top: 0; bottom: 0;
    background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0.10), transparent 70%);
    z-index: 4; pointer-events: none;
  }

  .folio {
    position: absolute; bottom: 28px;
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em;
    color: var(--ink-2); text-transform: uppercase;
    display: flex; gap: 16px; align-items: center;
    z-index: 6;
  }
  .folio.left  { left: 56px; }
  .folio.right { right: 56px; }
  .folio .num { color: var(--red); font-weight: 600; }
  .folio .rule { width: 36px; height: 1px; background: var(--ink-2); }

  .page {
    position: absolute; top: 0; bottom: 0; padding: 56px 56px 90px;
    display: flex; flex-direction: column;
  }
  .page.left  { left: 0; width: 50%; }
  .page.right { right: 0; width: 50%; }

  .kicker {
    font-family: var(--sans);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--red);
  }
  .deck { font-family: var(--serif); font-style: italic; color: var(--ink-2); font-weight: 400; }
  .byline { font-family: var(--sans); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--grey-1); font-weight: 500; }
  .smallcaps { font-family: var(--sans); text-transform: uppercase; letter-spacing: 0.16em; font-weight: 600; }
  .mono { font-family: var(--mono); }
  .rule-thick { height: 4px; background: var(--ink); border: none; margin: 0; }
  .rule-thin  { height: 1px; background: var(--ink); border: none; margin: 0; opacity: 0.7; }
  .rule-double { border: none; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); height: 4px; }
  .rule-red { height: 2px; background: var(--red); border: none; margin: 0; }

  .body-serif { font-family: var(--serif); font-weight: 400; color: var(--ink-2); line-height: 1.45; font-size: 18px; }
  .body-serif p { margin: 0 0 0.7em; }
  .body-serif p:last-child { margin-bottom: 0; }

  .pull {
    font-family: var(--serif); font-style: italic; font-weight: 400;
    font-size: 34px; line-height: 1.18; color: var(--ink);
    border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink);
    padding: 18px 0; margin: 0;
  }
  .pull::before { content: "\201C"; color: var(--red); }
  .pull::after  { content: "\201D"; color: var(--red); }

  /* COVER */
  #cover .nameplate {
    font-family: var(--serif); font-weight: 700;
    font-size: 240px; line-height: 0.82;
    letter-spacing: -0.04em;
    color: var(--ink);
    margin: 0;
    font-feature-settings: "ss01", "lnum";
  }
  #cover .nameplate em { font-style: italic; color: var(--red); font-weight: 500; }
  #cover .strap {
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: var(--mono); font-size: 14px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--ink-2);
    padding-bottom: 10px; border-bottom: 1px solid var(--ink);
    margin-bottom: 36px;
  }
  #cover .strap .issue { color: var(--red); font-weight: 600; }
  #cover .hero {
    flex: 1; display: grid; grid-template-columns: 1.1fr 0.9fr;
    gap: 56px; padding-top: 40px;
  }
  #cover .hero-left { display: flex; flex-direction: column; gap: 28px; }
  #cover .cover-head {
    font-family: var(--serif); font-weight: 600;
    font-size: 116px; line-height: 0.92; letter-spacing: -0.025em;
    margin: 0;
  }
  #cover .cover-head em { font-style: italic; font-weight: 500; }
  #cover .cover-head .red { color: var(--red); }
  #cover .cover-sub {
    font-family: var(--serif); font-style: italic;
    font-size: 26px; line-height: 1.3; color: var(--ink-2); max-width: 720px;
  }
  #cover .hero-right {
    border-left: 1px solid var(--ink); padding-left: 40px;
    display: flex; flex-direction: column;
    gap: 22px;
  }
  #cover .cover-line {
    border-bottom: 1px dashed rgba(0,0,0,0.35);
    padding-bottom: 18px;
  }
  #cover .cover-line:last-child { border-bottom: none; padding-bottom: 0; }
  #cover .cover-line .num {
    font-family: var(--mono); font-size: 11px;
    color: var(--red); letter-spacing: 0.18em;
    margin-bottom: 4px; display: block;
  }
  #cover .cover-line .ttl {
    font-family: var(--serif); font-size: 24px; line-height: 1.15;
    color: var(--ink); margin: 0 0 4px;
  }
  #cover .cover-line .pg {
    font-family: var(--sans); font-size: 11px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--grey-1);
  }
  #cover .barcode {
    position: absolute; bottom: 36px; right: 56px;
    display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  }
  #cover .barcode .bars { display: flex; gap: 2px; height: 56px; align-items: flex-end; }
  #cover .barcode .bars i {
    background: var(--ink); width: 2px; display: block;
  }
  #cover .barcode .price {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; color: var(--ink-2);
    text-transform: uppercase;
  }

  /* MASTHEAD / EDITOR */
  #masthead .contents-head {
    font-family: var(--serif); font-weight: 600;
    font-size: 96px; line-height: 0.9; letter-spacing: -0.02em; margin: 0;
  }
  #masthead .contents-head em { font-style: italic; color: var(--red); font-weight: 500; }
  #masthead .contents-list { display: flex; flex-direction: column; margin-top: 36px; }
  #masthead .contents-list .row {
    display: grid; grid-template-columns: 56px 1fr 60px;
    align-items: baseline; gap: 16px;
    padding: 14px 0; border-bottom: 1px solid rgba(0,0,0,0.25);
  }
  #masthead .contents-list .row .pg { font-family: var(--mono); color: var(--red); font-weight: 600; font-size: 16px; letter-spacing: 0.06em; }
  #masthead .contents-list .row .ttl { font-family: var(--serif); font-size: 24px; color: var(--ink); }
  #masthead .contents-list .row .ttl em { font-style: italic; color: var(--ink-2); }
  #masthead .contents-list .row .sec { font-family: var(--sans); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--grey-1); text-align: right; }
  #masthead .editor-stack {
    display: flex; flex-direction: column; gap: 22px; height: 100%;
  }
  #masthead .editor-head {
    font-family: var(--serif); font-weight: 500; font-style: italic;
    font-size: 52px; line-height: 0.98; letter-spacing: -0.01em; margin: 0;
  }
  #masthead .editor-body {
    font-family: var(--serif); font-size: 19px; line-height: 1.5; color: var(--ink-2); column-count: 1; max-width: 720px;
  }
  #masthead .editor-body p { margin: 0 0 0.7em; }
  #masthead .sign {
    margin-top: 10px;
    font-family: var(--serif); font-style: italic; font-size: 22px; color: var(--ink);
  }
  #masthead .sign .name { display: block; font-style: normal; font-size: 16px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--grey-1); margin-top: 6px; }
  #masthead .masthead-block {
    margin-top: auto;
    border-top: 1px solid var(--ink); padding-top: 18px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
  }
  #masthead .masthead-block dl { margin: 0; }
  #masthead .masthead-block dt {
    font-family: var(--sans); font-size: 9px; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--red); margin-bottom: 4px; font-weight: 600;
  }
  #masthead .masthead-block dd { margin: 0 0 8px; font-family: var(--serif); font-size: 14px; color: var(--ink-2); }

  /* NUMBERS INFOGRAPHIC */
  #numbers .nums-grid {
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
    gap: 0; height: calc(100% - 70px);
    border-top: 1px solid var(--ink);
    border-bottom: 1px solid var(--ink);
  }
  #numbers .nums-cell {
    padding: 28px 32px; display: flex; flex-direction: column;
    border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink);
    position: relative;
  }
  #numbers .nums-cell:nth-child(2n) { border-right: none; }
  #numbers .nums-cell:nth-last-child(-n+2) { border-bottom: none; }
  #numbers .nums-cell .lbl {
    font-family: var(--sans); font-size: 10px; letter-spacing: 0.24em;
    text-transform: uppercase; color: var(--grey-1); font-weight: 600;
  }
  #numbers .nums-cell .fig {
    font-family: var(--serif); font-weight: 600;
    font-size: 120px; line-height: 0.92; letter-spacing: -0.04em;
    color: var(--ink); margin-top: 14px;
  }
  #numbers .nums-cell .fig em { font-style: italic; color: var(--red); font-weight: 500; }
  #numbers .nums-cell .fig .sm { font-size: 34px; vertical-align: 26px; margin-left: 6px; color: var(--ink-2); font-weight: 400; }
  #numbers .nums-cell .cap {
    margin-top: auto; font-family: var(--serif); font-style: italic;
    font-size: 17px; line-height: 1.35; color: var(--ink-2); max-width: 92%;
  }

  .bar-chart { display: flex; flex-direction: column; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; }
  .bar-row .bar-label { font-family: var(--sans); font-size: 11px; color: var(--ink); letter-spacing: 0.05em; text-transform: uppercase; font-weight: 600; }
  .bar-row .bar-wrap { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
  .bar-row .bar {
    height: 18px; background: var(--ink); position: relative;
  }
  .bar-row .bar.red { background: var(--red); }
  .bar-row .bar-val { font-family: var(--mono); font-size: 12px; color: var(--ink); white-space: nowrap; }

  /* COVER STORY */
  #wiki .cs-head {
    font-family: var(--serif); font-weight: 600;
    font-size: 132px; line-height: 0.88; letter-spacing: -0.035em;
    margin: 0;
  }
  #wiki .cs-head em { font-style: italic; font-weight: 500; }
  #wiki .cs-head .red { color: var(--red); }
  #wiki .cs-deck {
    font-family: var(--serif); font-style: italic;
    font-size: 30px; line-height: 1.25; color: var(--ink-2); max-width: 760px;
  }
  #wiki .article {
    column-count: 2; column-gap: 36px; column-rule: 1px solid rgba(0,0,0,0.18);
    font-family: var(--serif); font-size: 17px; line-height: 1.5; color: var(--ink-2);
    margin-top: 28px;
  }
  #wiki .article p { margin: 0 0 0.6em; break-inside: avoid; }
  #wiki .article p:first-child::first-letter {
    font-family: var(--serif); font-weight: 700; font-size: 86px; line-height: 0.85;
    float: left; padding: 6px 10px 0 0; color: var(--red);
  }
  #wiki .sidebar {
    border-left: 4px solid var(--ink); padding-left: 22px;
    display: flex; flex-direction: column; gap: 14px;
  }
  #wiki .sidebar-head { font-family: var(--serif); font-weight: 600; font-size: 34px; line-height: 1.05; margin: 0; }
  #wiki .sidebar-head em { color: var(--red); font-style: italic; font-weight: 500; }
  .rank-list { display: flex; flex-direction: column; gap: 0; }
  .rank-list .r {
    display: grid; grid-template-columns: 38px 1fr auto; gap: 14px;
    padding: 12px 0; border-bottom: 1px solid rgba(0,0,0,0.22);
    align-items: baseline;
  }
  .rank-list .r:last-child { border-bottom: none; }
  .rank-list .r .n {
    font-family: var(--serif); font-weight: 600; font-size: 30px;
    color: var(--red); line-height: 1; font-style: italic;
  }
  .rank-list .r .t {
    font-family: var(--serif); font-size: 19px; line-height: 1.25; color: var(--ink);
  }
  .rank-list .r .t .meta { display: block; font-family: var(--sans); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--grey-1); margin-top: 4px; }
  .rank-list .r .v { font-family: var(--mono); font-size: 12px; color: var(--ink-2); white-space: nowrap; }

  /* THE DISCOURSE */
  #discourse .disc-head {
    font-family: var(--serif); font-weight: 600;
    font-size: 124px; line-height: 0.9; letter-spacing: -0.03em; margin: 0;
  }
  #discourse .disc-head em { font-style: italic; color: var(--red); font-weight: 500; }
  #discourse .disc-deck { font-family: var(--serif); font-style: italic; font-size: 24px; line-height: 1.3; color: var(--ink-2); max-width: 760px; }
  #discourse .grid-2 {
    display: grid; grid-template-columns: 1fr 1fr; gap: 36px; margin-top: 26px;
    flex: 1;
  }
  #discourse .col { display: flex; flex-direction: column; gap: 14px; }
  #discourse .col-head {
    display: flex; align-items: center; gap: 12px;
    border-top: 4px solid var(--ink); padding-top: 12px;
  }
  #discourse .col-head .dot {
    width: 14px; height: 14px; background: var(--red); border-radius: 50%;
  }
  #discourse .col-head .dot.dot-hn { background: #ff6600; }
  #discourse .col-head .dot.dot-rd { background: #ff4500; }
  #discourse .col-head .dot.dot-bs { background: #1185fe; }
  #discourse .col-head .dot.dot-md { background: #6364ff; }
  #discourse .col-head .name {
    font-family: var(--sans); font-size: 13px; letter-spacing: 0.22em;
    text-transform: uppercase; font-weight: 700; color: var(--ink);
  }
  #discourse .col-head .meta { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--grey-1); letter-spacing: 0.12em; text-transform: uppercase; }
  #discourse .col-list { display: flex; flex-direction: column; }
  #discourse .col-list .li {
    padding: 9px 0; border-bottom: 1px dotted rgba(0,0,0,0.25);
    display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: baseline;
  }
  #discourse .col-list .li:last-child { border-bottom: none; }
  #discourse .col-list .li .n { font-family: var(--mono); font-size: 11px; color: var(--grey-1); }
  #discourse .col-list .li .t { font-family: var(--serif); font-size: 17px; line-height: 1.3; color: var(--ink); }
  #discourse .col-list .li .v { font-family: var(--mono); font-size: 11px; color: var(--ink-2); }

  /* MARKETS & EARTH */
  .panel-head {
    font-family: var(--serif); font-weight: 600;
    font-size: 96px; line-height: 0.9; letter-spacing: -0.03em; margin: 0;
  }
  .panel-head em { font-style: italic; color: var(--red); font-weight: 500; }
  .panel-deck { font-family: var(--serif); font-style: italic; font-size: 22px; line-height: 1.3; color: var(--ink-2); max-width: 720px; margin-top: 8px; }
  #markets .mkt-list { display: flex; flex-direction: column; margin-top: 22px; }
  #markets .mkt-row {
    display: grid; grid-template-columns: 40px 1fr 170px;
    gap: 16px; padding: 16px 0; align-items: center;
    border-bottom: 1px solid rgba(0,0,0,0.22);
  }
  #markets .mkt-row:last-child { border-bottom: none; }
  #markets .mkt-row .n {
    font-family: var(--serif); font-weight: 600; font-size: 28px; color: var(--ink); font-style: italic;
  }
  #markets .mkt-row .t { font-family: var(--serif); font-size: 19px; line-height: 1.3; color: var(--ink); }
  #markets .mkt-row .vol {
    font-family: var(--mono); font-size: 13px; color: var(--ink-2);
    text-align: right;
  }
  #markets .mkt-row .vol .big { font-family: var(--serif); font-size: 26px; color: var(--red); font-weight: 600; display: block; line-height: 1; }
  #markets .mkt-row .vol .sm { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--grey-1); margin-top: 4px; display: block; }

  .quake-map {
    margin-top: 22px; flex: 1; min-height: 0;
    border: 1px solid var(--ink); position: relative; background: var(--paper-2);
    overflow: hidden;
  }
  .quake-map .map-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(0,0,0,0.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(0,0,0,0.06) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .quake-map .map-lbl {
    position: absolute; font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--grey-1);
  }
  .quake-map .pin {
    position: absolute; transform: translate(-50%, -50%);
    border-radius: 50%; background: var(--red);
    box-shadow: 0 0 0 2px var(--paper);
    pointer-events: none;
  }
  .quake-map .pin::after {
    content: ""; position: absolute; inset: -8px; border: 1px solid var(--red);
    border-radius: 50%; opacity: 0.5;
  }
  .quake-map .pin-label {
    position: absolute; transform: translate(8px, -50%);
    font-family: var(--sans); font-size: 10px; letter-spacing: 0.05em;
    color: var(--ink); white-space: nowrap;
    background: var(--paper); padding: 1px 4px; border: 1px solid var(--ink);
  }
  .quake-map .pin-label a.mag-link { border-bottom: none; }
  .quake-map .pin-label a.mag-link:hover { color: var(--red); border-bottom: none; }
  .quake-legend {
    display: flex; gap: 16px; align-items: center; margin-top: 10px;
    font-family: var(--sans); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--grey-1);
  }
  .quake-legend .swatch { background: var(--red); border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: middle; }

  /* CODE & MODELS */
  .feature-head {
    font-family: var(--serif); font-weight: 600;
    font-size: 96px; line-height: 0.9; letter-spacing: -0.03em; margin: 0;
  }
  .feature-head em { font-style: italic; color: var(--red); font-weight: 500; }
  .feature-deck { font-family: var(--serif); font-style: italic; font-size: 22px; line-height: 1.3; color: var(--ink-2); }
  #code .terminal {
    background: var(--ink); color: var(--paper); padding: 22px 26px; font-family: var(--mono);
    font-size: 14px; line-height: 1.7; flex: 1; min-height: 0;
    border: 1px solid var(--ink);
    position: relative;
    margin-top: 16px;
  }
  #code .terminal::before {
    content: "GITHUB / TRENDING"; position: absolute; top: -1px; right: -1px;
    background: var(--red); color: var(--paper); font-family: var(--sans);
    font-size: 10px; letter-spacing: 0.22em; padding: 4px 10px; font-weight: 600;
  }
  #code .terminal .row { display: grid; grid-template-columns: 32px 1fr auto; gap: 12px; align-items: baseline; padding: 6px 0; border-bottom: 1px dashed rgba(255,255,255,0.12); }
  #code .terminal .row:last-child { border-bottom: none; }

<deck-stage aspect="1920/1080" id="deck" no-rail></deck-stage>

    <span class="mag-pg"><span id="mag-pg-cur">01</span><span class="mag-pg-sep">/</span><span id="mag-pg-tot">11</span></span>
    <span class="mag-sec" id="mag-section">Cover</span>
  </div>
  <button class="mag-btn mag-next" type="button" aria-label="Next spread">
    <span class="lbl">Next</span>

<script>
(async () => {
  let data;
  try {
    const res = await fetch('data/latest.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('latest.json: ' + res.status);
    data = await res.json();
  } catch (err) {
    console.error(err);
    document.body.insertAdjacentHTML('beforeend',
      '<pre style="position:fixed;inset:20px;color:#fff;font-family:monospace;">Failed to load data/latest.json — ' + String(err) + '</pre>');
    return;
  }

  const deck = document.getElementById('deck');
  deck.innerHTML = renderMagazine(data);

  setupMagNav(deck);

  const s = document.createElement('script');
  s.src = 'deck-stage.js';
  document.body.appendChild(s);
  const s2 = document.createElement('script');
  s2.src = 'image-slot.js';
  document.body.appendChild(s2);
})();

function setupMagNav(deck) {
  const nav = document.getElementById('mag-nav');
  const tocEl = nav.querySelector('.mag-toc');
  const curEl = document.getElementById('mag-pg-cur');
  const totEl = document.getElementById('mag-pg-tot');
  const secEl = document.getElementById('mag-section');
  const prevBtn = nav.querySelector('.mag-prev');
  const nextBtn = nav.querySelector('.mag-next');

  const sections = Array.from(deck.children);
  const total = sections.length;
  totEl.textContent = String(total).padStart(2, '0');

  // Parse "01 Cover" → { num: '01', label: 'Cover' }
  const labels = sections.map((sec, i) => {
    const raw = sec.getAttribute('data-screen-label') || ('Spread ' + (i+1));
    const m = raw.match(/^\s*(\d+)\s+(.*)$/);
    return m ? { num: m[1].padStart(2, '0'), label: m[2].trim() } : { num: String(i+1).padStart(2,'0'), label: raw };
  });

  // Build TOC (short labels)
  const TOC_SHORT = {
    'Cover': 'Cover',
    'Contents': 'Contents',
    'The Numbers': 'Numbers',
    'Cover Story': 'Feature',
    'Most Read': 'Most Read',
    'The Discourse': 'Discourse',
    'Foreign Desk': 'Foreign',
    'Markets and Tremors': 'Markets',
    'Code and Models': 'Code',
    'Watch and Play': 'Listings',
    'Colophon': 'Colophon'
  };
  tocEl.innerHTML = labels.map((l, i) => {
    const short = TOC_SHORT[l.label] || l.label;
    return '<button class="toc-item" type="button" role="tab" data-i="' + i + '">' +
      '<span class="pg">' + l.num + '</span><span class="t">' + escAttr(short) + '</span></button>';
  }).join('');

  tocEl.addEventListener('click', (e) => {
    const t = e.target.closest('.toc-item');
    if (!t) return;
    const i = Number(t.dataset.i);
    if (deck.goTo) deck.goTo(i);
  });
  prevBtn.addEventListener('click', () => { if (deck.prev) deck.prev(); });
  nextBtn.addEventListener('click', () => { if (deck.next) deck.next(); });

  function update(i) {
    const idx = Math.max(0, Math.min(total - 1, i));
    curEl.textContent = labels[idx].num;
    secEl.textContent = labels[idx].label;
    for (const el of tocEl.children) {
      el.toggleAttribute('aria-current', Number(el.dataset.i) === idx);
    }
  }

  deck.addEventListener('slidechange', (e) => update(e.detail.index));
  update(0);

  nav.hidden = false;
  requestAnimationFrame(() => nav.setAttribute('data-ready', ''));
}

function escAttr(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ---------- helpers ----------

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function attr(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
// Wrap inner HTML in an external link. innerHtml is assumed to be already-escaped/safe.
function link(url, innerHtml, extraClass) {
  if (!url) return innerHtml;
  // Only allow http(s) urls — anything else is rendered as plain text.
  const u = String(url);
  if (!/^https?:\/\//i.test(u)) return innerHtml;
  return '<a class="mag-link' + (extraClass ? ' ' + extraClass : '') + '" href="' + attr(u) + '" target="_blank" rel="noopener noreferrer">' + innerHtml + '</a>';
}
function fmt(n) { return Number(n || 0).toLocaleString('en-US'); }
function abbr(n) {
  n = Number(n || 0);
  if (n >= 1e9) return (n/1e9).toFixed(1) + 'B';
  if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(0) + 'K';
  return String(n);
}
function dollarsAbbr(n) {
  n = Number(n || 0);
  if (n >= 1e6) return '$' + (n/1e6).toFixed(2) + 'M';
  if (n >= 1e3) return '$' + (n/1e3).toFixed(1) + 'K';
  return '$' + Math.round(n);
}
function pad2(n) { return String(n).padStart(2, '0'); }
function dayOfYear(d) {
  const start = Date.UTC(d.getUTCFullYear(), 0, 0);
  return Math.floor((d.getTime() - start) / 86400000);
}
function truncate(s, n) {
  s = String(s || '');
  if (s.length <= n) return s;
  return s.slice(0, n - 1).replace(/[\s,.\-—:;]+$/, '') + '…';
}
function cleanWikiTitle(t) {
  return String(t || '').replace(/\s*\(.*?\)\s*$/, '');
}
function items(data, key) {
  const s = data.sources && data.sources[key];

  MX: '🇲🇽 Mexico', KR: '🇰🇷 South Korea', RU: '🇷🇺 Russia', CN: '🇨🇳 China',
  TR: '🇹🇷 Türkiye'
};
function dateLine(country) {
  const k = String(country || '').toLowerCase();
  return COUNTRY_CITIES[k] || ('WIRE / ' + (k || 'world').toUpperCase());
}
function geoLabel(code) {
  return GEO_LABELS[code] || (code ? '🌐 ' + code : '🌐 World');
}

// ---------- main ----------

function renderMagazine(data) {
  const gen = new Date(data.generated_at || Date.now());
  const issueNo = dayOfYear(gen);
  const issueStr = 'Issue No. ' + issueNo;
  const issueShort = 'No. ' + issueNo;
  const weekday = WEEKDAYS[gen.getUTCDay()];
  const month = MONTHS[gen.getUTCMonth()];
  const dateLong = weekday + ' · ' + gen.getUTCDate() + ' ' + month + ' ' + gen.getUTCFullYear() + ' · Daily Edition';
  const dateShort = gen.getUTCDate() + ' ' + month + ' ' + gen.getUTCFullYear();
  const snapshotIso = gen.toISOString().replace('T', ' ').slice(0, 16) + ' UTC';
  const sourceCount = Object.keys(data.sources || {}).length;
  const ctx = { data, gen, issueNo, issueStr, issueShort, weekday, month, dateLong, dateShort, snapshotIso, sourceCount };

  return [
    spreadCover(ctx),
    spreadMasthead(ctx),
    spreadNumbers(ctx),
    spreadWiki(ctx),
    spreadWiki2(ctx),
    spreadDiscourse(ctx),
    spreadForeign(ctx),
    spreadMarkets(ctx),
    spreadCode(ctx),
    spreadWatch(ctx),
    spreadBack(ctx),
  ].join('\n');
}

  // Bars: top 4 steam + wiki + top YT

    steam[0] ? steam[0].peak_24h : 1,
    yt ? yt.views : 1,
    wikiTop.views

    const w = Math.min(100, (val / max) * 100);
    return `
      <div class="bar-row">

function spreadDiscourse(c) {
  const hn = items(c.data, 'hackernews').slice(0,5);
  const rd = items(c.data, 'reddit').slice(0,5);
  const bs = items(c.data, 'bluesky').slice(0,5);
  const md = items(c.data, 'mastodon-trending').slice(0,5);

  function col(dotClass, name, meta, list, formatter, urlPicker) {
    const pickUrl = urlPicker || (it => it.url);
    return `
        <div class="col">
          <div class="col-head">
            <span class="dot ${dotClass}"></span><span class="name">${esc(name)}</span>
            <span class="meta">${esc(meta)}</span>
          </div>
          <div class="col-list">
            ${list.map((it, i) => `
            <div class="li"><span class="n">${pad2(i+1)}</span><span class="t">${link(pickUrl(it), esc(truncate(it.title, 80)))}</span><span class="v">${esc(formatter(it))}</span></div>`).join('')}
          </div>
        </div>`;
  }

  const pullHn = hn[0] ? truncate(hn[0].title, 48) : '—';
  const pullRd = rd[0] ? truncate(rd[0].title, 48) : '—';

function spreadForeign(c) {
  const med = items(c.data, 'mediastack').slice(0, 5);
  const tr = items(c.data, 'google-trends');

  const wires = med.map(it => `
        <article class="wire">
          <span class="city">${esc(dateLine(it.country))} —</span>
          <div>
            <h3>${link(it.url, esc(truncate(it.title, 140)))}</h3>
            <p>${esc(it.source_name || 'wire')} · ${esc((it.category || 'general').toUpperCase())}</p>
          </div>
        </article>`).join('');

  // pick top 6 trends, prefer mix of geos
  const seenGeos = new Set();
  const picks = [];
  for (const it of tr) {
    const g = (it.geos && it.geos[0]) || '';
    const key = g;
    if (!seenGeos.has(key)) { seenGeos.add(key); picks.push(it); }
    if (picks.length === 6) break;
  }
  while (picks.length < 6 && picks.length < tr.length) picks.push(tr[picks.length]);

  const geos = picks.map(it => {
    const g = (it.geos && it.geos[0]) || '';
    const trendsUrl = 'https://trends.google.com/trends/explore?q=' + encodeURIComponent(it.title) + (g ? '&geo=' + encodeURIComponent(g) : '');
    return `
        <div class="geo">
          <div class="row">
            <span class="label">${esc(geoLabel(g))}</span>
            <span class="geocode">geo: ${esc(g || '—')}</span>
          </div>
          <p class="term">${link(it.news_url || trendsUrl, esc(truncate(it.title, 50)))}</p>
          <p class="gloss">${it.news_url ? link(it.news_url, esc(truncate(it.news_title || it.news_source || 'trending search', 110))) : esc(truncate(it.news_title || it.news_source || 'trending search', 110))}</p>
        </div>`;
  }).join('');

  return `
  <section class="spread two-page" id="foreign" data-screen-label="07 Foreign Desk">
    <div class="issue-strap">
      <span class="ttl">Foreign Desk</span>
      <span class="section">Datelines &amp; What the World Searched</span>

      <p class="body-serif" style="font-size:18px;max-width:680px;">
        Five stories the world’s wires were moving this morning, in the order Mediastack handed them to us — which is to say, no particular order at all.
      </p>

      <div style="display:flex;flex-direction:column;margin-top:18px;">${wires}</div>
    </div>

    <div class="page right" style="padding-top:96px;display:flex;flex-direction:column;">
      <div class="kicker">The World, in queries</div>
      <h2 class="head-xl">What <em>they</em><br>Googled.</h2>
      <p class="panel-deck" style="margin-top:6px;">Trending searches across geographies, taken from the same minute. A regional fixture, an actor, a local news cycle.</p>

      <div class="geo-grid">${geos}</div>

      <p style="font-family:var(--serif);font-style:italic;font-size:13px;color:var(--grey-1);margin-top:12px;line-height:1.4;">
        Fig. 2 — Google Trends RSS, aggregated. Terms that appear in more than one country list rank higher; today, every one of these was a single‑country phenomenon.

    <div class="folio left"><span class="num">14</span><span class="rule"></span><span>Datelines · Web Pulse ${esc(String(c.issueNo))}</span></div>
    <div class="folio right"><span>The World, Googled · Web Pulse ${esc(String(c.issueNo))}</span><span class="rule"></span><span class="num">15</span></div>

}

          <p style="font-family:var(--serif);font-size:58px;line-height:0.95;color:var(--red);margin:0;font-weight:600;">${wiki ? link(wiki.url, esc(bestNumber)) : esc(bestNumber)}</p>
          <p style="font-family:var(--serif);font-style:italic;font-size:16px;color:var(--ink-2);margin:8px 0 0;">${esc(bestNumberCap)}</p>
        </div>
      </div>

      <dl class="colophon" style="margin-top:18px;">
        <div><dt>Type</dt><dd>Fraunces (display &amp; body), Inter (sans), JetBrains Mono (figures &amp; folios)</dd></div>
        <div><dt>Stock</dt><dd>Cream #F1E9D8, ink #0D0C09, accent red #B23A23</dd></div>
        <div><dt>Snapshot</dt><dd>${esc(c.snapshotIso)} · ${esc(String(c.sourceCount))} sources · ${esc(fmt(totalItems))} items ranked.</dd></div>
        <div><dt>Reissue</dt><dd>Daily, 06:00 PT. Previous edition stays live until then.</dd></div>
      </dl>

      <span class="endmark">— end —</span>
    </div>

    <div class="folio left"><span class="num">22</span><span class="rule"></span><span>Sources · Web Pulse ${esc(String(c.issueNo))}</span></div>
    <div class="folio right"><span>Web Pulse · ${esc(c.issueShort)} · ${esc(c.dateShort)}</span><span class="rule"></span><span class="num">∎</span></div>
  </section>`;
}
</script>

</body>
</html>
